# Server block for the nginx:alpine image.
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        model/gltf-binary
        application/octet-stream;

    # Hashed build assets: cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public models: long cache, not fingerprinted, so no immutable.
    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # .glb served with the registered glTF binary MIME type.
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        default_type model/gltf-binary;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Entry document: always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: unknown paths serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
